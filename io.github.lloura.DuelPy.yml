app-id: io.github.lloura.DuelPy
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: duelpy

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/pkgconfig
  - /share/man
  - "*.la"
  - "*.a"

modules:
  - name: duelpy
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/lloura/DuelPy.git
        tag: 50.0
        commit: 895509f4962bbcac4a01c2becd78a1fc6aca4a44
