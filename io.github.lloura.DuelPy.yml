app-id: io.github.lloura.DuelPy
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: duelpy

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/pkgconfig
  - /share/man
  - "*.la"
  - "*.a"

modules:
  - name: duelpy
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/lloura/DuelPy.git
        tag: 51.0
        commit: 1d65835f603aed4f10d2e976d2cbd587cedea60a
